services:
  dbmaria2:
    extends:
      file: docker-compose.yml
      service: db
  dbmysql:
    image: mirror.gcr.io/library/mysql:8.4
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cacti
      MYSQL_USER: spine
      MYSQL_PASSWORD: spine
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  policy:
    build:
      context: ../..
      dockerfile: tests/snmpv3/Dockerfile.policy
    depends_on:
      db:
        condition: service_healthy
      dbmysql:
        condition: service_healthy
  dbmysql2:
    extends:
      service: dbmysql
