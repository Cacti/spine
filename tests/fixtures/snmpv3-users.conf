# Copy into an owned temporary persistent snmpd.conf; never a system directory.
# The authentication passphrase is the public RFC3414 Appendix A.3.2 vector.
createUser regression-v3-noauth
createUser regression-v3-auth SHA maplesyrup
createUser regression-v3-priv SHA maplesyrup AES regression-privacy
