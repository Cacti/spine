# Local checks that mirror CI. Install once with `pre-commit install`.
# Each rev is a full commit SHA so a moved tag cannot change what runs; the
# comment names the tag it was taken from.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # The fuzz corpus must keep its exact bytes, LICENSE keeps the form
      # feeds of the published LGPL text (including LICENSES/ copies), and Makefile.in is generated by
      # automake. spine.conf.dist is installed as spine.conf, and the
      # uninstall rule in Makefile.am removes spine.conf only when it matches
      # spine.conf.dist byte for byte, so editing it would orphan the config
      # installed by earlier releases. test_util_strings.c has one
      # whitespace-only line that will go when the file is next edited for a
      # real change.
      - id: trailing-whitespace
        exclude: &exact-bytes ^(tests/fuzz/corpus/|vendor/|LICENSE$|LICENSES/|Makefile\.in$|etc/spine\.conf\.dist$|tests/unit/test_util_strings\.c$)
      - id: end-of-file-fixer
        exclude: *exact-bytes
      - id: check-yaml

  # shellcheck-py ships the binary as a wheel, so the hook needs no Docker.
  # scripts/copyright_year.sh is an upstream release helper outside the CI shellcheck
  # file set. The moved debug/package helpers now run under the normal checks.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      # Commits often stage one script without tests/support/test-harness.sh, which
      # the integration scripts source.
      - id: shellcheck
        args: [--external-sources]
        exclude: ^scripts/copyright_year\.sh$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  # Same file set as the codespell job in static-analysis.yml. CHANGELOG
  # keeps upstream release notes verbatim and is left out there too.
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        args: [--ignore-words=.codespell-ignore-words.txt]
        files: '(\.(c|h|md|sh|ya?ml)|^configure\.ac|^Makefile\.am)$'
        exclude: ^vendor/

  # Formats only the lines that differ from HEAD, which during a commit are
  # the staged lines. Running clang-format on whole files would reformat
  # code nobody touched; see .clang-format.
  - repo: local
    hooks:
      - id: git-clang-format
        name: clang-format (changed lines)
        language: python
        additional_dependencies: [clang-format==18.1.8]
        entry: git-clang-format --diff --extensions c,h
        args: ["--", ":(exclude)vendor/uthash/uthash.h"]
        pass_filenames: false
        files: '\.[ch]$'
