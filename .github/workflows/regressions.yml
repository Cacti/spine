name: Production regressions

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client:
          - choice: mariadb
            package: libmariadb-dev
          - choice: mysql
            package: libmysqlclient-dev
    env:
      SPINE_CLIENT_PACKAGE: ${{ matrix.client.package }}
      SPINE_CLIENT_CHOICE: ${{ matrix.client.choice }}
    services:
      database:
        image: mirror.gcr.io/library/mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: spine_regressions
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      remote-database:
        image: mirror.gcr.io/library/mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: spine_regressions
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool help2man "$SPINE_CLIENT_PACKAGE" mariadb-client libsnmp-dev snmpd libssl-dev libcap2-bin libcmocka-dev lcov
      - name: Build and test production code
        run: |
          set -eu
          mkdir -p config m4
          autoreconf -fi
          ./configure --with-mysql-client="$SPINE_CLIENT_CHOICE"
          if ! make -j2 check; then
            cat test-suite.log
            exit 1
          fi
      - name: Verify database configuration loading
        env:
          SPINE_TEST_DB_HOST: 127.0.0.1
          SPINE_TEST_REMOTE_DB_HOST: 127.0.0.1
        run: |
          set -eu
          mariadb --protocol=TCP --host=127.0.0.1 --user=root spine_regressions < tests/fixtures/configuration.sql
          mariadb --protocol=TCP --host=127.0.0.1 --user=root spine_regressions < tests/fixtures/poller.sql
          # The fixture preserves Cacti's historical zero-date defaults.
          mariadb --protocol=TCP --host=127.0.0.1 --port=3307 --user=root --init-command="SET SESSION sql_mode='NO_ENGINE_SUBSTITUTION'" spine_regressions < tests/fixtures/configuration.sql
          mariadb --protocol=TCP --host=127.0.0.1 --port=3307 --user=root --init-command="SET SESSION sql_mode='NO_ENGINE_SUBSTITUTION'" spine_regressions < tests/fixtures/poller.sql
          ./test_spine_regressions --database
      - name: Verify SNMP availability against local agent
        # TLS fixtures are separate from the schema-mutating database suites.
        env:
          SPINE_TEST_SNMP_HOST: 127.0.0.1
          SPINE_TEST_DB_HOST: 127.0.0.1
        run: |
          set -eu
          snmpd -f -Lo -C -c tests/fixtures/snmpd.conf > snmp-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid"; wait "$agent_pid" || true' EXIT
          sleep 1
          ./test_spine_regressions --snmp-agent
          ./test_spine_regressions --database
          ./test_spine_faults --database
      - name: Verify authenticated SNMPv3 against owned agent
        env:
          SPINE_SNMPV3_EVIDENCE_DIR: snmpv3-evidence
        run: tests/tools/run_snmpv3.sh
      - name: Verify database TLS trust and downgrade boundaries
        run: bash tests/tools/run_database_tls.sh
      - name: Preserve database TLS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: database-tls-${{ matrix.client.choice }}-${{ github.sha }}
          path: tls-evidence/
          if-no-files-found: error
      - name: Verify ICMP against local loopback
        run: |
          set -eu
          ./test_spine_regressions --icmp-no-capability
          sudo setcap cap_net_raw+ep ./test_spine_regressions
          ./test_spine_regressions --raw-icmp
      - name: Verify the setuid root privilege drop
        run: |
          set -eu
          mariadb --protocol=TCP --host=127.0.0.1 --user=root -e "CREATE USER IF NOT EXISTS 'cactiuser'@'%' IDENTIFIED BY 'cactiuser'; GRANT SELECT, INSERT, UPDATE, DELETE ON spine_regressions.* TO 'cactiuser'@'%';"
          sudo ./test_spine_regressions --privilege-drop
          sudo install -o root -g root -m 4755 ./test_spine_regressions /usr/local/bin/test_spine_setuid
          # Close the unprivileged datagram path so the setuid one answers.
          ping_range=$(sysctl -n net.ipv4.ping_group_range)
          sudo sysctl -w net.ipv4.ping_group_range="1 0"
          /usr/local/bin/test_spine_setuid --setuid-icmp
          sudo sysctl -w net.ipv4.ping_group_range="$ping_range"
          sudo SPINE_TEST_DB_HOST=127.0.0.1 top_builddir="$PWD" sh tests/regression/test_setuid_privilege_drop.sh
      - name: Measure every production translation unit
        env:
          SPINE_TEST_SNMP_HOST: 127.0.0.1
          SPINE_TEST_DB_HOST: 127.0.0.1
        run: |
          set -eu
          snmpd -f -Lo -C -c tests/fixtures/snmpd.conf > coverage-snmp-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid"; wait "$agent_pid" || true' EXIT
          sleep 1
          tests/tools/run_coverage.sh
      - name: Preserve coverage and source provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-coverage-${{ matrix.client.choice }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
