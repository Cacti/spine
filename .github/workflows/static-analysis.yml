name: Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  COMMON_DEPS: >-
    autoconf automake libtool make pkg-config cmake ninja-build
    gcc clang llvm clang-tools cppcheck codespell shellcheck shfmt golang-go
    libsnmp-dev default-libmysqlclient-dev help2man libssl-dev
  CFLAGS_ANALYZE: >-
    -std=c11 -D_DEFAULT_SOURCE -O1 -g3 -fno-omit-frame-pointer
  CLANG_TIDY_CHECKS: >-
    clang-analyzer-*,bugprone-*,cert-*

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install actionlint dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y golang-go shellcheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          GOBIN="${PWD}/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "${PWD}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: |
          set -euo pipefail
          "${PWD}/.local/bin/actionlint" -color

  shell-lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shell lint dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shfmt and shellcheck
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files '.github/scripts/*.sh' | sort -u)

          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo 'No shell files found for linting.'
            exit 0
          fi

          shfmt -d -i 2 -ci "${shell_files[@]}"
          shellcheck -x "${shell_files[@]}"

  codespell:
    name: codespell
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install spelling dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Run codespell on tracked source/docs
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.c' '*.h' '*.md' '*.txt' '*.yml' '*.yaml' 'Makefile.am' 'configure.ac')
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No eligible files found for codespell."
            exit 0
          fi

          codespell \
            --quiet-level=2 \
            --ignore-words=.codespell-ignore-words.txt \
            "${files[@]}" \
            | tee codespell-report.txt

      - name: Upload codespell report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: codespell-report
          path: codespell-report.txt
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install clang-tidy dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure build
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-tidy -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="${CFLAGS_ANALYZE}" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            echo "RUN_CLANG_TIDY=true" >> "${GITHUB_ENV}"
            echo "CLANG_TIDY_USE_CMAKE=true" >> "${GITHUB_ENV}"
          elif [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=clang CFLAGS="${CFLAGS_ANALYZE}"
            echo "RUN_CLANG_TIDY=true" >> "${GITHUB_ENV}"
            echo "CLANG_TIDY_USE_CMAKE=false" >> "${GITHUB_ENV}"
          else
            echo "No supported build system found." >&2
            exit 1
          fi

      - name: Run clang-tidy
        if: env.RUN_CLANG_TIDY == 'true'
        run: |
          set -euo pipefail
          mapfile -t sources < <(git ls-files '*.c')
          if [[ "${#sources[@]}" -eq 0 ]]; then
            echo 'No C sources found for clang-tidy.'
            exit 0
          fi

          if [[ "${CLANG_TIDY_USE_CMAKE}" == "true" ]]; then
            {
              clang-tidy \
                -checks="${CLANG_TIDY_CHECKS}" \
                -p build-tidy \
                "${sources[@]}" \
                || echo "::warning::clang-tidy reported diagnostics; see clang-tidy-report artifact and SARIF."
            } 2>&1 | tee clang-tidy-report.txt
          else
            {
              clang-tidy \
                -checks="${CLANG_TIDY_CHECKS}" \
                "${sources[@]}" \
                -- \
                -std=c11 -D_DEFAULT_SOURCE -I. -Iconfig -I/usr/include/mysql \
                || echo "::warning::clang-tidy reported diagnostics; see clang-tidy-report artifact and SARIF."
            } 2>&1 | tee clang-tidy-report.txt
          fi

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          if-no-files-found: ignore

      - name: Convert clang-tidy report to SARIF
        if: always() && env.RUN_CLANG_TIDY == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/clang_tidy_to_sarif.py clang-tidy-report.txt clang-tidy.sarif

      - name: Upload clang-tidy SARIF
        if: always() && env.RUN_CLANG_TIDY == 'true'
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

  scan-build:
    name: clang static analyzer (scan-build)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure build system
        run: |
          set -euo pipefail
          if [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=clang CFLAGS="${CFLAGS_ANALYZE}"
            echo "BUILD_SYSTEM=autotools" >> "${GITHUB_ENV}"
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-analyze -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="${CFLAGS_ANALYZE}" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            echo "BUILD_SYSTEM=cmake" >> "${GITHUB_ENV}"
          else
            echo "No supported build system found." >&2
            exit 1
          fi

      - name: Run scan-build
        run: |
          set -euo pipefail
          mkdir -p scan-build-report
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            scan-build --keep-going -o scan-build-report \
              make -j"$(nproc)" \
              || echo "::warning::scan-build reported diagnostics; see scan-build-report artifact."
          else
            scan-build --keep-going -o scan-build-report \
              cmake --build build-analyze --parallel "$(nproc)" \
              || echo "::warning::scan-build reported diagnostics; see scan-build-report artifact."
          fi

      - name: Upload scan-build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: scan-build-report
          path: scan-build-report
          if-no-files-found: ignore

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cppcheck dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure for compile database when possible
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-cppcheck -G Ninja \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_BUILD_TYPE=Debug
            echo "CPPCHECK_MODE=project" >> "${GITHUB_ENV}"
          else
            echo "CPPCHECK_MODE=sources" >> "${GITHUB_ENV}"
          fi

      - name: Run cppcheck
        run: |
          set -euo pipefail
          if [[ "${CPPCHECK_MODE}" == "project" ]]; then
            cppcheck \
              --project=build-cppcheck/compile_commands.json \
              --enable=warning,style,performance,portability \
              --std=c11 \
              --max-configs=1 \
              --inconclusive \
              --inline-suppr \
              --suppress=missingIncludeSystem \
              2> cppcheck-report.txt
          else
            mapfile -t sources < <(git ls-files '*.c' '*.h')
            if [[ "${#sources[@]}" -eq 0 ]]; then
              echo "No C sources found for cppcheck."
              exit 0
            fi
            cppcheck \
              --enable=warning,style,performance,portability \
              --std=c11 \
              --max-configs=1 \
              --inconclusive \
              --inline-suppr \
              --suppress=missingIncludeSystem \
              "${sources[@]}" \
              2> cppcheck-report.txt
          fi

          if [[ ! -f cppcheck-report.txt ]]; then
            : > cppcheck-report.txt
          fi

          grep -E '^[^:]+:[0-9]+:' cppcheck-report.txt | sort -u > cppcheck-report.normalized.txt || true

          if [[ -f .github/cppcheck-baseline.txt ]]; then
            sort -u .github/cppcheck-baseline.txt > cppcheck-baseline.sorted.txt
          else
            : > cppcheck-baseline.sorted.txt
          fi

          comm -23 cppcheck-report.normalized.txt cppcheck-baseline.sorted.txt > cppcheck-regressions.txt || true

          if [[ -s cppcheck-regressions.txt ]]; then
            echo "::warning::New cppcheck findings not in baseline:"
            cat cppcheck-regressions.txt
          fi

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: cppcheck-report
          path: |
            cppcheck-report.txt
            cppcheck-report.normalized.txt
            cppcheck-regressions.txt
          if-no-files-found: ignore

      - name: Convert cppcheck report to SARIF
        if: always()
        run: |
          set -euo pipefail
          python3 .github/scripts/cppcheck_to_sarif.py cppcheck-report.txt cppcheck.sarif

      - name: Upload cppcheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck
