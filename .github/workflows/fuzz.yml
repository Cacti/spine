name: Fuzz

on:
  pull_request:
    branches: [develop]
    paths: ['**.c', '**.h', 'tests/fuzz/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-spine
        with:
          extra-packages: clang pkg-config

      # A pull request gets a short regression run against the committed corpus.
      # The weekly schedule runs long enough to explore.
      - name: Fuzz
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=900
          else
            seconds=60
          fi
          make -C tests/fuzz FUZZ_SECONDS="$seconds" run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            tests/fuzz/crash-*
            tests/fuzz/leak-*
            tests/fuzz/timeout-*
          if-no-files-found: ignore
