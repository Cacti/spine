name: Fuzz

on:
  pull_request:
    branches: [develop]
    paths: ['**.c', '**.h', 'tests/fuzz/**', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang libmysqlclient-dev libsnmp-dev libssl-dev \
            autoconf automake libtool help2man pkg-config

      - name: Generate config.h
        run: |
          set -euo pipefail
          ./bootstrap
          ./configure

      # A pull request gets a short regression run against the committed corpus.
      # The weekly schedule runs long enough to explore.
      - name: Fuzz
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            seconds=900
          else
            seconds=60
          fi
          make -C tests/fuzz FUZZ_SECONDS="$seconds" run

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            tests/fuzz/crash-*
            tests/fuzz/leak-*
            tests/fuzz/timeout-*
          if-no-files-found: ignore
