name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: github/codeql-action/init@ce28f5bb42b7a342e9c1c977301c0a1aca3958b1
        with:
          languages: c-cpp

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mariadb-server libmariadb3 libmariadb-dev libmariadb-dev-compat \
            libsnmp-dev libssl-dev \
            help2man autoconf automake libtool dos2unix
          sudo ./bootstrap
          sudo ./configure
          sudo make -j

      - uses: github/codeql-action/analyze@ce28f5bb42b7a342e9c1c977301c0a1aca3958b1
