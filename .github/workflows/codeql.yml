name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  COMMON_DEPS: >-
    autoconf automake libtool make pkg-config
    gcc clang llvm
    libsnmp-dev default-libmysqlclient-dev help2man libssl-dev

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce28f5bb42b7a342e9c1c977301c0a1aca3958b1 # v3.28.10
        with:
          languages: c-cpp

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "${COMMON_DEPS}"

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure and build
        run: |
          set -euo pipefail
          chmod +x ./configure || true
          ./configure CC=gcc CFLAGS='-O2 -g' LDFLAGS='-Wl,-z,relro,-z,now'
          make -j"$(nproc)"

      - name: Analyze
        uses: github/codeql-action/analyze@ce28f5bb42b7a342e9c1c977301c0a1aca3958b1 # v3.28.10
