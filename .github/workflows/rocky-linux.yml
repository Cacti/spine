name: Rocky Linux compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 6"

permissions:
  contents: read

concurrency:
  group: rocky-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocky-linux:
    name: Rocky Linux 9 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test in Rocky Linux 9
        run: |
          docker run --rm \\
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \\
            --workdir /workspace \\
            rockylinux:9 \\
            bash -euo pipefail -c '
              dnf -y group install "Development Tools"
              dnf -y install cmake openssl-devel libtirpc-devel mariadb-connector-c-devel libxml2-devel libcurl-devel net-snmp-devel zlib-devel
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON
              cmake --build build --parallel "$(nproc)"
              ctest --test-dir build --output-on-failure
            '
