name: Rocky Linux compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 6"
  pull_request:
    branches: [develop, 'refactor/c17-series-*']
    paths:
      - "configure.ac"
      - "Makefile.am"
      - "bootstrap"
      - "**.c"
      - "**.h"
      - "scripts/test-distros.sh"
      - ".github/workflows/rocky-linux.yml"

permissions:
  contents: read

concurrency:
  group: rocky-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocky-linux:
    name: Rocky Linux 9 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in Rocky Linux 9
        env:
          # The Rocky project maintains this namespace; the old Docker Hub
          # library image no longer receives current base-system updates.
          IMAGE: quay.io/rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
          LOG_DIR: ${{ runner.temp }}/rocky-logs
        run: |
          set -euo pipefail
          # Same complete cmocka suite and unprivileged builder as the matrix,
          # without installing the unrelated Development Tools package group.
          scripts/test-distros.sh "$IMAGE"

      - name: Upload Rocky failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocky-linux-9-logs
          path: ${{ runner.temp }}/rocky-logs
          if-no-files-found: warn
          retention-days: 14
