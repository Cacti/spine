name: Release Verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'release-*'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  COMMON_DEPS: >-
    autoconf automake libtool make pkg-config cmake ninja-build
    gcc binutils file curl
    libsnmp-dev default-libmysqlclient-dev help2man libssl-dev
  CFLAGS_RELEASE: >-
    -std=c11 -D_DEFAULT_SOURCE -O2 -g -D_FORTIFY_SOURCE=3
    -fstack-protector-strong -fstack-clash-protection -fPIE
  LDFLAGS_RELEASE: >-
    -Wl,-z,relro,-z,now -pie
  EXPECT_PIE: '1'
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  release-verify:
    name: hardened release verification
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install release dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure (Autotools or CMake)
        run: |
          set -euo pipefail
          if [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=gcc CFLAGS="${CFLAGS_RELEASE}" LDFLAGS="${LDFLAGS_RELEASE}"
            echo "BUILD_SYSTEM=autotools" >> "${GITHUB_ENV}"
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-release -G Ninja \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_C_FLAGS="${CFLAGS_RELEASE}" \
              -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS_RELEASE}" \
              -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS_RELEASE}" \
              -DCMAKE_BUILD_TYPE=Release
            echo "BUILD_SYSTEM=cmake" >> "${GITHUB_ENV}"
          else
            echo 'No supported build system found.' >&2
            exit 1
          fi

      - name: Build release
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            make -j"$(nproc)"
          else
            cmake --build build-release --parallel "$(nproc)"
          fi

      - name: Verify ELF hardening
        run: |
          set -euo pipefail
          BIN_PATH=''
          if [[ -x ./spine ]]; then
            BIN_PATH='./spine'
          else
            BIN_PATH="$(find . -maxdepth 4 -type f -name spine -perm -111 | head -n 1 || true)"
          fi

          if [[ -z "${BIN_PATH}" ]]; then
            echo 'Unable to locate built spine binary.' >&2
            exit 1
          fi

          echo "BIN_PATH=${BIN_PATH}" >> "${GITHUB_ENV}"

          readelf -W -l "${BIN_PATH}" | tee hardening-readelf-program-headers.txt
          readelf -W -d "${BIN_PATH}" | tee hardening-readelf-dynamic.txt

          if ! grep -q 'GNU_RELRO' hardening-readelf-program-headers.txt; then
            echo 'RELRO segment missing.' >&2
            exit 1
          fi

          if ! grep -Eq 'BIND_NOW|FLAGS.*NOW' hardening-readelf-dynamic.txt; then
            echo 'BIND_NOW not present.' >&2
            exit 1
          fi

          if [[ "${EXPECT_PIE}" == '1' ]]; then
            if ! readelf -h "${BIN_PATH}" | grep -Eq 'Type:[[:space:]]+DYN'; then
              echo 'PIE expected but binary is not ET_DYN.' >&2
              exit 1
            fi
          fi

      - name: make install DESTDIR smoke test
        run: |
          set -euo pipefail
          rm -rf stage
          mkdir -p stage

          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            make install DESTDIR="${PWD}/stage"
          else
            DESTDIR="${PWD}/stage" cmake --install build-release
          fi

          INSTALLED_BIN="$(find stage -type f -name spine -perm -111 | head -n 1 || true)"
          if [[ -z "${INSTALLED_BIN}" ]]; then
            echo 'Installed spine binary not found under DESTDIR.' >&2
            exit 1
          fi

          echo "INSTALLED_BIN=${INSTALLED_BIN}" >> "${GITHUB_ENV}"
          ldd "${INSTALLED_BIN}" | tee installed-binary-ldd.txt

          if grep -q 'not found' installed-binary-ldd.txt; then
            echo 'Installed binary has unresolved shared library dependencies.' >&2
            exit 1
          fi

      - name: Install syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "${HOME}/.local/bin" v1.20.0
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Generate SBOM
        run: |
          set -euo pipefail
          syft "dir:stage" -o spdx-json=sbom.spdx.json

      - name: Package staged release artifact
        run: |
          set -euo pipefail
          tar -czf spine-release-stage.tgz stage
          sha256sum spine-release-stage.tgz > spine-release-stage.tgz.sha256

      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: release-verification
          path: |
            hardening-readelf-program-headers.txt
            hardening-readelf-dynamic.txt
            installed-binary-ldd.txt
            sbom.spdx.json
            spine-release-stage.tgz
            spine-release-stage.tgz.sha256
            stage
          if-no-files-found: ignore

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: spine-release-stage.tgz
