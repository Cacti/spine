name: Integration

on:
  pull_request:
    branches: [develop, 'refactor/c17-series-*', 'fix/post-c17-execution-hardening']
    paths:
      - '**.c'
      - '**.h'
      - 'configure.ac'
      - 'Makefile.am'
      - 'bootstrap'
      - 'Dockerfile'
      - '.dockerignore'
      - 'tests/integration/**'
      - 'tests/support/test-harness.sh'
      - 'tests/snmpv3/**'
      - '.github/actions/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snmpv3:
    name: SNMPv3 integration (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [mariadb, mysql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Brings up MariaDB and an snmpd, then polls a real device through
      # poll_host() and checks the value lands in poller_output.
      - name: Poll an SNMPv3 device end to end
        env:
          SPINE_TEST_DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          tests/snmpv3/scripts/run-integration.sh

      - name: Exercise concurrent host polling
        if: matrix.database == 'mariadb'
        env:
          SPINE_TEST_DATABASE: mariadb
          SPINE_TEST_HOSTS: 24
          SPINE_TEST_THREAD_COUNTS: "1 4 12"
          SPINE_TEST_REPEATS: 1
          SPINE_TEST_TIMEOUT_SECONDS: 120
          SPINE_TEST_ARTIFACT_DIR: test-artifacts/concurrency
        run: |
          set -euo pipefail
          tests/integration/test_concurrency.sh

      - name: Exercise SNMP packet loss and recovery
        if: matrix.database == 'mariadb'
        env:
          SPINE_TEST_TIMEOUT_SECONDS: 120
          SPINE_TEST_ARTIFACT_DIR: test-artifacts/network-faults
        run: |
          set -euo pipefail
          tests/integration/test_network_faults.sh

      - name: Exercise healthy hosts beside a delayed or unreachable v3 device
        if: matrix.database == 'mariadb'
        run: |
          set -euo pipefail
          for fault in delay loss; do
            SPINE_TEST_SNMP_FAULT="$fault" SPINE_TEST_HOSTS=8 SPINE_TEST_THREAD_COUNTS='1 4 12' \
              SPINE_TEST_ARTIFACT_DIR="test-artifacts/mixed-$fault" tests/integration/test_concurrency.sh
          done

      - name: Reap a real PHP script-server process
        run: tests/integration/test_script_server_reap.sh

      - name: Verify destination-specific inserts and duplicate updates
        if: matrix.database == 'mariadb'
        run: bash tests/integration/test_destination_upserts.sh

      - name: Show container logs on failure
        if: failure()
        env:
          SPINE_TEST_DATABASE: ${{ matrix.database }}
        run: |
          set -euo pipefail
          cd tests/snmpv3
          compose=(docker compose)
          if [[ "$SPINE_TEST_DATABASE" == mysql ]]; then
            compose+=(-f docker-compose.yml -f docker-compose.mysql.yml)
          fi
          "${compose[@]}" logs --no-color || true

      - name: Upload integration diagnostics
        if: always() && matrix.database == 'mariadb'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics-${{ matrix.database }}
          path: test-artifacts
          if-no-files-found: warn
          retention-days: 14
