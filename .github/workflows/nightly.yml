name: Nightly Heavy Checks

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  COMMON_DEPS: >-
    autoconf automake libtool make pkg-config cmake ninja-build
    gcc clang llvm valgrind
    libsnmp-dev default-libmysqlclient-dev help2man libssl-dev
  TSAN_OPTIONS: halt_on_error=1:history_size=7:log_path=tsan
  ASAN_OPTIONS: >-
    detect_leaks=1:abort_on_error=1:strict_string_checks=1:
    check_initialization_order=1:detect_stack_use_after_return=1:
    symbolize=1:log_path=asan
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=ubsan

jobs:
  tsan:
    name: clang tsan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure (Autotools or CMake)
        run: |
          set -euo pipefail
          CFLAGS='-O1 -g3 -fno-omit-frame-pointer -fsanitize=thread'
          LDFLAGS='-fsanitize=thread'
          if [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=clang CFLAGS="${CFLAGS}" LDFLAGS="${LDFLAGS}"
            echo "BUILD_SYSTEM=autotools" >> "${GITHUB_ENV}"
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-tsan -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="${CFLAGS}" \
              -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_BUILD_TYPE=Debug
            echo "BUILD_SYSTEM=cmake" >> "${GITHUB_ENV}"
          else
            echo 'No supported build system found.' >&2
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            make -j"$(nproc)"
          else
            cmake --build build-tsan --parallel "$(nproc)"
          fi

      - name: Test
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            if make -n check >/dev/null 2>&1; then
              make check VERBOSE=1
            elif make -n test >/dev/null 2>&1; then
              make test VERBOSE=1
            else
              echo '::notice::No make check/test target found.'
            fi
          else
            if ctest --test-dir build-tsan -N > ctest-list.txt 2>&1 && grep -Eq 'Total Tests: [1-9]' ctest-list.txt; then
              ctest --test-dir build-tsan --output-on-failure --parallel "$(nproc)"
            else
              echo '::notice::No CTest tests found.'
            fi
          fi

      - name: Upload tsan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: nightly-tsan-logs
          path: |
            tsan*
            config.log
            build-tsan/CMakeFiles/CMakeConfigureLog.yaml
            build-tsan/CMakeFiles/CMakeError.log
            *.log
          if-no-files-found: ignore

  asan-soak:
    name: clang asan/ubsan soak
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure (Autotools or CMake)
        run: |
          set -euo pipefail
          CFLAGS='-std=c11 -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=address,undefined'
          LDFLAGS='-fsanitize=address,undefined'
          if [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=clang CFLAGS="${CFLAGS}" LDFLAGS="${LDFLAGS}"
            echo "BUILD_SYSTEM=autotools" >> "${GITHUB_ENV}"
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-asan -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS="${CFLAGS}" \
              -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_BUILD_TYPE=Debug
            echo "BUILD_SYSTEM=cmake" >> "${GITHUB_ENV}"
          else
            echo 'No supported build system found.' >&2
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            make -j"$(nproc)"
          else
            cmake --build build-asan --parallel "$(nproc)"
          fi

      - name: Test
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            if make -n check >/dev/null 2>&1; then
              make check VERBOSE=1
            elif make -n test >/dev/null 2>&1; then
              make test VERBOSE=1
            else
              echo '::notice::No make check/test target found.'
            fi
          else
            if ctest --test-dir build-asan -N > ctest-list.txt 2>&1 && grep -Eq 'Total Tests: [1-9]' ctest-list.txt; then
              ctest --test-dir build-asan --output-on-failure --parallel "$(nproc)"
            else
              echo '::notice::No CTest tests found.'
            fi
          fi

      - name: Enforce asan/ubsan leak trend baseline
        run: |
          set -euo pipefail
          python3 .github/scripts/check-leak-trend.py \
            --mode asan \
            --baseline .github/nightly-leak-baseline.json \
            --output nightly-asan-summary.json \
            --logs 'asan*' 'ubsan*' '*.log'

      - name: Upload asan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: nightly-asan-logs
          path: |
            asan*
            ubsan*
            nightly-asan-summary.json
            config.log
            build-asan/CMakeFiles/CMakeConfigureLog.yaml
            build-asan/CMakeFiles/CMakeError.log
            *.log
          if-no-files-found: ignore

  valgrind:
    name: valgrind test pass
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${COMMON_DEPS}

      - name: Bootstrap
        run: |
          set -euo pipefail
          if [[ -x ./bootstrap ]]; then
            ./bootstrap
          elif [[ -f ./configure.ac || -f ./configure.in ]]; then
            autoreconf -fi
          fi

      - name: Configure (Autotools or CMake)
        run: |
          set -euo pipefail
          CFLAGS='-O0 -g3 -fno-omit-frame-pointer'
          if [[ -f ./configure ]]; then
            chmod +x ./configure || true
            ./configure CC=gcc CFLAGS="${CFLAGS}" LDFLAGS=''
            echo "BUILD_SYSTEM=autotools" >> "${GITHUB_ENV}"
          elif [[ -f CMakeLists.txt ]]; then
            cmake -S . -B build-valgrind -G Ninja \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_C_FLAGS="${CFLAGS}" \
              -DCMAKE_BUILD_TYPE=Debug
            echo "BUILD_SYSTEM=cmake" >> "${GITHUB_ENV}"
          else
            echo 'No supported build system found.' >&2
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            make -j"$(nproc)"
          else
            cmake --build build-valgrind --parallel "$(nproc)"
          fi

      - name: Run tests under valgrind when available
        run: |
          set -euo pipefail
          if [[ "${BUILD_SYSTEM}" == "autotools" ]]; then
            if make -n valgrind-check >/dev/null 2>&1; then
              make valgrind-check
            elif make -n check >/dev/null 2>&1; then
              mapfile -t bins < <(find tests -maxdepth 3 -type f -perm -111 ! -name '*.sh' 2>/dev/null || true)
              if [[ "${#bins[@]}" -gt 0 ]]; then
                for t in "${bins[@]}"; do
                  valgrind \
                    --error-exitcode=1 \
                    --leak-check=full \
                    --show-leak-kinds=all \
                    --track-origins=yes \
                    --log-file="valgrind.$(basename "${t}").log" \
                    "${t}"
                done
              else
                echo '::notice::No standalone test binaries found for valgrind; running make check.'
                make check VERBOSE=1
              fi
            else
              echo '::notice::No make valgrind-check/check target found.'
            fi
          else
            if ctest --test-dir build-valgrind -N > ctest-list.txt 2>&1 && grep -Eq 'Total Tests: [1-9]' ctest-list.txt; then
              memcheck_log='ctest-memcheck.txt'
              set +e
              ctest --test-dir build-valgrind -T memcheck --output-on-failure > "${memcheck_log}" 2>&1
              memcheck_rc=$?
              set -e
              cat "${memcheck_log}"

              if [[ ${memcheck_rc} -eq 0 ]]; then
                echo '::notice::CTest memcheck completed successfully.'
              elif grep -Eqi 'memory checker.*not set|cannot find.*memory checker|memorycheckcommand' "${memcheck_log}"; then
                echo '::warning::CTest memcheck unavailable; running regular ctest.'
                ctest --test-dir build-valgrind --output-on-failure
              else
                echo '::error::CTest memcheck reported failures.' >&2
                exit "${memcheck_rc}"
              fi
            else
              echo '::notice::No CTest tests found.'
            fi
          fi

      - name: Enforce valgrind leak trend baseline
        run: |
          set -euo pipefail
          python3 .github/scripts/check-leak-trend.py \
            --mode valgrind \
            --baseline .github/nightly-leak-baseline.json \
            --output nightly-valgrind-summary.json \
            --logs 'valgrind*.log' 'build-valgrind/Testing/Temporary/*'

      - name: Upload valgrind artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: nightly-valgrind-logs
          path: |
            valgrind*.log
            nightly-valgrind-summary.json
            build-valgrind/Testing/Temporary
            config.log
            *.log
          if-no-files-found: ignore

  fuzz-smoke:
    name: libfuzzer harness smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install fuzz dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Discover fuzz harnesses
        run: |
          set -euo pipefail
          mapfile -t harnesses < <(
            git ls-files 'fuzz/**/*.c' 'tests/fuzz/**/*.c' '*_fuzz.c' '*fuzz*.c' | sort -u
          )

          if [[ "${#harnesses[@]}" -eq 0 ]]; then
            echo '::warning::No C fuzz harnesses found (expected under fuzz/ or tests/fuzz/).'
            echo 'status=none' > fuzz-status.txt
            exit 0
          fi

          printf '%s\n' "${harnesses[@]}" > fuzz-harnesses.txt
          echo 'status=found' > fuzz-status.txt

      - name: Build and execute fuzz smoke runs
        run: |
          set -euo pipefail

          if [[ ! -f fuzz-harnesses.txt ]]; then
            echo 'No fuzz harnesses discovered; skipping fuzz execution.'
            exit 0
          fi

          mkdir -p fuzz-bin fuzz-corpus

          while IFS= read -r harness; do
            [[ -n "${harness}" ]] || continue
            bin="fuzz-bin/$(basename "${harness%.*}")"

            clang -O1 -g -fsanitize=fuzzer,address -I. "${harness}" -o "${bin}"
            "${bin}" -runs=1000 -max_total_time=60 fuzz-corpus
          done < fuzz-harnesses.txt

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: nightly-fuzz-logs
          path: |
            fuzz-status.txt
            fuzz-harnesses.txt
            fuzz-bin
            fuzz-corpus
            *.log
          if-no-files-found: ignore

  soak-placeholder:
    name: soak/integration placeholder
    runs-on: ubuntu-24.04
    needs: [tsan, asan-soak, valgrind, fuzz-smoke]

    steps:
      - name: Placeholder
        run: |
          set -euo pipefail
          echo 'Placeholder for long-running soak/integration checks.'
          echo 'Add SNMP simulator container and multi-hour stress scenario here.'
