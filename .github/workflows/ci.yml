name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_DEPS: >-
    cmake ninja-build pkg-config gcc clang
    libsnmp-dev default-libmysqlclient-dev libssl-dev
    libseccomp-dev libuv1-dev uthash-dev

jobs:
  build:
    name: build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          packages: ${{ env.BUILD_DEPS }}

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSPINE_BUILD_MAIN=ON \
            -DBUILD_TESTING=OFF

      - name: Build production binary
        run: cmake --build build --target spine --parallel

      - name: Smoke test
        run: ./build/spine --help >/dev/null

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: spine-${{ matrix.compiler }}
          path: build/spine
          if-no-files-found: ignore

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        uses: ./.github/actions/install-apt-deps
        with:
          packages: ${{ env.BUILD_DEPS }}

      - name: Configure test build
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSPINE_BUILD_MAIN=ON \
            -DBUILD_TESTING=ON

      - name: Build and run tests
        run: |
          set -euo pipefail
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure

  policy:
    name: workflow policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate workflows
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
          python3 .github/scripts/check-workflow-policy.py
