name: CI

on:
  push:
    branches: [develop, '1.2.x']
  pull_request:
    branches: [develop, '1.2.x']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-spine
        with:
          configure-args: --enable-warnings

      - name: Build Spine
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Run the unit tests
        run: |
          set -euo pipefail
          make check

  # Coverage is reported, not gated.  The number is only meaningful once
  # something measures it; the threshold conversation comes after that.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-spine
        with:
          extra-packages: gcovr
          cflags: -g -O0 --coverage
          ldflags: --coverage

      - name: Build instrumented
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Run the unit tests
        run: |
          set -euo pipefail
          make check

      - name: Report coverage
        run: |
          set -euo pipefail
          # configure leaves instrumented conftest objects behind and gcovr
          # cannot resolve their sources
          rm -f ./*conftest*.gcno ./*conftest*.gcda
          gcovr -r . --exclude 'tests/.*' --txt --print-summary

  flawfinder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install flawfinder
        run: pip install flawfinder==2.0.19

      # Note: flawfinder will light up like a christmas tree on this codebase.
      # error-level=5 means only critical hits fail the build — the rest is
      # informational so we have a baseline to chip away at.
      - name: Run flawfinder
        run: |
          set -euo pipefail
          flawfinder \
            --minlevel=3 \
            --error-level=5 \
            --columns \
            --context \
            . | tee flawfinder-report.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: flawfinder-report
          path: flawfinder-report.txt

  # Spine is a threaded network daemon; ASan and UBSan are the checks most
  # likely to catch a real defect here.  The unit tests are what actually
  # exercises the code, so they are what runs instrumented.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:exitcode=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-spine
        with:
          extra-packages: clang
          cflags: -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          ldflags: -fsanitize=address,undefined

      - name: Build with ASan and UBSan
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Run the unit tests under the sanitizers
        run: |
          set -euo pipefail
          make check

      - name: Smoke-test the binary under the sanitizers
        run: |
          set -euo pipefail
          ./spine --version
          ./spine --help > /dev/null

  # A release tarball that cannot be compiled is a release blocker, and the
  # only way to catch it is to build from the tarball the way a packager does.
  distcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-spine

      - name: make distcheck
        run: |
          set -euo pipefail
          make distcheck
