name: CI

on:
  push:
    branches: [1.2.x]
  pull_request:
    branches: [1.2.x, 'fix/*-1.2']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
          libmysqlclient-dev \
          default-mysql-client \
          libsnmp-dev libssl-dev build-essential \
          help2man autoconf automake libtool dos2unix

      - name: Prepare for Spine Build
        run: |
          set -euo pipefail
          ./bootstrap
          ./configure --enable-warnings

      - name: Build Spine
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Run backport contracts
        run: |
          python3 tests/backport_contracts.py

      - name: Test script process ownership and cleanup
        run: make check

      - name: Test polling failures, partitions, and query budget
        env:
          TEST_DATABASE_PORT: ${{ job.services.database.ports['3306'] }}
        run: |
          config="$RUNNER_TEMP/spine-test-client.cnf"
          umask 077
          printf '[client]\nhost=127.0.0.1\nport=%s\nuser=root\n' "$TEST_DATABASE_PORT" > "$config"
          SPINE_TEST_DB_CONFIG="$config" make integration-check

  flawfinder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install flawfinder
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/flawfinder-requirements.txt

      # Note: flawfinder will light up like a christmas tree on this codebase.
      # error-level=5 means only critical hits fail the build — the rest is
      # informational so we have a baseline to chip away at.
      - name: Run flawfinder
        run: |
          set -euo pipefail
          flawfinder \
            --minlevel=3 \
            --error-level=5 \
            --columns \
            --context \
            . | tee flawfinder-report.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flawfinder-report
          path: flawfinder-report.txt
