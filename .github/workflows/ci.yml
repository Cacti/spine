name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  COMMON_DEPS: >-
    autoconf automake libtool make pkg-config cmake ninja-build
    gcc clang llvm lcov valgrind cppcheck clang-tools
    libsnmp-dev default-libmysqlclient-dev
  ASAN_OPTIONS: >-
    detect_leaks=1:abort_on_error=1:strict_string_checks=1:
    check_initialization_order=1:detect_stack_use_after_return=1:
    symbolize=1:log_path=asan
  UBSAN_OPTIONS: >-
    print_stacktrace=1:halt_on_error=1:log_path=ubsan
  TSAN_OPTIONS: >-
    halt_on_error=1:history_size=7:log_path=tsan
  CFLAGS_COMMON: >-
    -Wall -Wextra -Wpedantic -Wformat=2 -Wshadow -Wconversion
    -Wpointer-arith -Wcast-qual -Wwrite-strings
    -Wstrict-prototypes -Wmissing-prototypes

jobs:
  build-and-test:
    name: ${{ matrix.os }} | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: ${{ !matrix.nightly_only || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: gcc-release-hardened
            cc: gcc
            cflags: >-
              -O2 -g -D_FORTIFY_SOURCE=3
              -fstack-protector-strong -fstack-clash-protection
            ldflags: >-
              -Wl,-z,relro,-z,now
            nightly_only: false

          - os: ubuntu-24.04
            name: gcc-release-hardened
            cc: gcc
            cflags: >-
              -O2 -g -D_FORTIFY_SOURCE=3
              -fstack-protector-strong -fstack-clash-protection
            ldflags: >-
              -Wl,-z,relro,-z,now
            nightly_only: false

          - os: ubuntu-22.04
            name: clang-asan-ubsan
            cc: clang
            cflags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined
            ldflags: >-
              -fsanitize=address,undefined
            nightly_only: false

          - os: ubuntu-24.04
            name: clang-asan-ubsan
            cc: clang
            cflags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined
            ldflags: >-
              -fsanitize=address,undefined
            nightly_only: false

          - os: ubuntu-22.04
            name: clang-asan-leak
            cc: clang
            cflags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,leak
            ldflags: >-
              -fsanitize=address,leak
            nightly_only: false

          - os: ubuntu-24.04
            name: clang-asan-leak
            cc: clang
            cflags: >-
              -O1 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,leak
            ldflags: >-
              -fsanitize=address,leak
            nightly_only: false

          - os: ubuntu-22.04
            name: clang-tsan
            cc: clang
            cflags: >-
