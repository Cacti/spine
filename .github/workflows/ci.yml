  flawfinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"

      - name: Install flawfinder
        run: pip install flawfinder==2.0.19

      # Note: flawfinder will light up like a christmas tree on this codebase.
      # error-level=5 means only critical hits fail the build — the rest is
      # informational so we have a baseline to chip away at.
      - name: Run flawfinder
        run: |
          flawfinder \
            --minlevel=3 \
            --error-level=5 \
            --columns \
            --context \
            . | tee flawfinder-report.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: flawfinder-report
          path: flawfinder-report.txt

  build-cmake-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libmysqlclient-dev libsnmp-dev libssl-dev

      - name: Configure
        run: |
          cmake --preset ci-main

      - name: Build
        run: cmake --build --preset ci-main

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-openssl
            pkg-config

      - name: Check Net-SNMP availability
        id: netsnmp
        run: |
          if pacman -Ss '^mingw-w64-x86_64-net-snmp$' >/dev/null 2>&1; then
            pacman --noconfirm -S --needed mingw-w64-x86_64-net-snmp
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MSYS2 does not currently publish mingw-w64-x86_64-net-snmp; skipping the Windows compile on this runner."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: |
          if [ "${{ steps.netsnmp.outputs.available }}" = "true" ]; then
            cmake --preset ci-main
          else
            cmake --preset ci-smoke
          fi

      - name: Build
        run: |
          if [ "${{ steps.netsnmp.outputs.available }}" = "true" ]; then
            cmake --build --preset ci-main
          else
            cmake --build --preset ci-smoke
          fi

      - name: Run CTest
        run: |
          if [ "${{ steps.netsnmp.outputs.available }}" = "true" ]; then
            ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Upload binary
        if: steps.netsnmp.outputs.available == 'true' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: spine-windows-x64
          path: build/spine.exe

      - name: Configure crash dumps
        if: always()
        shell: pwsh
        run: |
          $dumpDir = "${{ github.workspace }}\crashdumps"
          New-Item -ItemType Directory -Path $dumpDir -Force
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\spine.exe"
          New-Item -Path $regPath -Force
          Set-ItemProperty -Path $regPath -Name "DumpType" -Value 2 -Type DWord
          Set-ItemProperty -Path $regPath -Name "DumpFolder" -Value $dumpDir -Type ExpandString

      - name: Upload crash dumps
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: failure()
        with:
          name: crash-dumps
          path: crashdumps/
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install build dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            mysql-client \
            net-snmp \
            openssl@3

      - name: Configure
        run: |
          cmake --preset ci-main -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/mysql-client;/opt/homebrew/opt/net-snmp;/opt/homebrew/opt/openssl@3"

      - name: Build
        run: cmake --build --preset ci-main

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
