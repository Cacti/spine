  flawfinder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install flawfinder
        run: pip install flawfinder==2.0.19

      # Note: flawfinder will light up like a christmas tree on this codebase.
      # error-level=5 means only critical hits fail the build — the rest is
      # informational so we have a baseline to chip away at.
      - name: Run flawfinder
        run: |
          flawfinder \
            --minlevel=3 \
            --error-level=5 \
            --columns \
            --context \
            . | tee flawfinder-report.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flawfinder-report
          path: flawfinder-report.txt

  build-cmake-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libmysqlclient-dev libsnmp-dev libssl-dev

      - name: Configure
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -B build

      - name: Build
        run: cmake --build build

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: msys2/setup-msys2@d44ca8e88d8b43d56cf71b6e8e17253983e8e4f7
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-net-snmp
            mingw-w64-x86_64-openssl
            pkg-config

      - name: Configure
        run: |
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            ..

      - name: Build
        run: cmake --build build

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: spine-windows-x64
          path: build/spine.exe

      - name: Configure crash dumps
        if: always()
        shell: pwsh
        run: |
          $dumpDir = "${{ github.workspace }}\crashdumps"
          New-Item -ItemType Directory -Path $dumpDir -Force
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\spine.exe"
          New-Item -Path $regPath -Force
          Set-ItemProperty -Path $regPath -Name "DumpType" -Value 2 -Type DWord
          Set-ItemProperty -Path $regPath -Name "DumpFolder" -Value $dumpDir -Type ExpandString

      - name: Upload crash dumps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: crash-dumps
          path: crashdumps/
          if-no-files-found: ignore
