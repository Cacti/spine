name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build dependencies
        run: |
          sudo dnf update -y
          sudo dnf config-manager --enable crb
          sudo dnf install -y
            mariadb-server mariadb-devel net-snmp net-snmp-devel \
            openssl-devel \
            help2man autoconf automake libtool dos2unix

      - name: Search libraries
        run: |
          find /usr/include -name mysql.h

      - name: Prepare for Spine Build
        run: |
          ./bootstrap
          ./configure --with-mysql=/usr/include/mariadb

      - name: Check the config.status for paths
        run: |
          cat config.status

      - name: Build Spine
        run: |
          make -j CFLAGS="-Wall -Wextra"

  cppcheck:
    runs-on: rockylinux:9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install cppcheck
        run: |
          sudo dnf -y upgrade 
          sudo dnf -y install cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --std=c11 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=checkersReport \
            --suppress=variableScope \
            --suppress=unreadVariable \
            --suppress=shadowVariable \
            --suppress=constVariablePointer \
            --suppress=redundantAssignment \
            --suppress=toomanyconfigs \
            *.c *.h

  flawfinder:
    runs-on: rockylinux:9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install flawfinder
        run: pip install flawfinder==2.0.19

      # Note: flawfinder will light up like a christmas tree on this codebase.
      # error-level=5 means only critical hits fail the build — the rest is
      # informational so we have a baseline to chip away at.
      - name: Run flawfinder
        run: |
          flawfinder \
            --minlevel=3 \
            --error-level=5 \
            --columns \
            --context \
            . | tee flawfinder-report.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flawfinder-report
          path: flawfinder-report.txt
