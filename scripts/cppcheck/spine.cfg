<!--
  cppcheck defines no compiler macros, so spine_types.h erases the
  __attribute__((noreturn)) on die() before cppcheck reads it. Without this
  the analyzer treats every "if (p == NULL) die(...)" as falling through.
  cppcheck matches library entries by argument count, hence the variadic.
-->
<def format="2">
  <function name="die">
    <noreturn>true</noreturn>
    <arg nr="1"/>
    <arg nr="variadic"/>
  </function>
</def>
